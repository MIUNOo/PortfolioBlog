<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Severity by Category heatmap. UX has F-01 Critical, F-02 High, F-05 and F-07 Medium. Functional has F-03 High and F-06 Medium. Content has F-04 High. Accessibility has F-08 Low.">
  <style>
    .label   { font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .axis    { font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #2a2a2a; letter-spacing: 0.04em; text-transform: uppercase; }
    .cat     { font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #2a2a2a; }
    .filled  { fill: #ffffff; }
    .empty-t { fill: #999; font-size: 18px; }
    .crit    { fill: #c0392b; }
    .high    { fill: #e67e22; }
    .med     { fill: #f1c40f; }
    .med-t   { fill: #1a1a1a; }
    .low     { fill: #16a085; }
    .empty   { fill: #cccccc; opacity: 0.35; }
    @media (prefers-color-scheme: dark) {
      .axis    { fill: #e8e8e8; }
      .cat     { fill: #e8e8e8; }
      .empty-t { fill: #888; }
      .empty   { fill: #888888; opacity: 0.2; }
    }
  </style>

  <!-- Column headers -->
  <text x="240" y="36" text-anchor="middle" class="axis">Critical</text>
  <text x="390" y="36" text-anchor="middle" class="axis">High</text>
  <text x="540" y="36" text-anchor="middle" class="axis">Medium</text>
  <text x="690" y="36" text-anchor="middle" class="axis">Low</text>

  <!-- Row 1: UX -->
  <text x="155" y="92" text-anchor="end" class="cat">UX</text>
  <rect x="170" y="60" width="140" height="60" rx="6" class="crit"/>
  <text x="240" y="96" text-anchor="middle" class="label filled">F-01</text>
  <rect x="320" y="60" width="140" height="60" rx="6" class="high"/>
  <text x="390" y="96" text-anchor="middle" class="label filled">F-02</text>
  <rect x="470" y="60" width="140" height="60" rx="6" class="med"/>
  <text x="540" y="96" text-anchor="middle" class="label med-t">F-05, F-07</text>
  <rect x="620" y="60" width="140" height="60" rx="6" class="empty"/>
  <text x="690" y="96" text-anchor="middle" class="empty-t">—</text>

  <!-- Row 2: Functional -->
  <text x="155" y="162" text-anchor="end" class="cat">Functional</text>
  <rect x="170" y="130" width="140" height="60" rx="6" class="empty"/>
  <text x="240" y="166" text-anchor="middle" class="empty-t">—</text>
  <rect x="320" y="130" width="140" height="60" rx="6" class="high"/>
  <text x="390" y="166" text-anchor="middle" class="label filled">F-03</text>
  <rect x="470" y="130" width="140" height="60" rx="6" class="med"/>
  <text x="540" y="166" text-anchor="middle" class="label med-t">F-06</text>
  <rect x="620" y="130" width="140" height="60" rx="6" class="empty"/>
  <text x="690" y="166" text-anchor="middle" class="empty-t">—</text>

  <!-- Row 3: Content -->
  <text x="155" y="232" text-anchor="end" class="cat">Content</text>
  <rect x="170" y="200" width="140" height="60" rx="6" class="empty"/>
  <text x="240" y="236" text-anchor="middle" class="empty-t">—</text>
  <rect x="320" y="200" width="140" height="60" rx="6" class="high"/>
  <text x="390" y="236" text-anchor="middle" class="label filled">F-04</text>
  <rect x="470" y="200" width="140" height="60" rx="6" class="empty"/>
  <text x="540" y="236" text-anchor="middle" class="empty-t">—</text>
  <rect x="620" y="200" width="140" height="60" rx="6" class="empty"/>
  <text x="690" y="236" text-anchor="middle" class="empty-t">—</text>

  <!-- Row 4: Accessibility -->
  <text x="155" y="302" text-anchor="end" class="cat">Accessibility</text>
  <rect x="170" y="270" width="140" height="60" rx="6" class="empty"/>
  <text x="240" y="306" text-anchor="middle" class="empty-t">—</text>
  <rect x="320" y="270" width="140" height="60" rx="6" class="empty"/>
  <text x="390" y="306" text-anchor="middle" class="empty-t">—</text>
  <rect x="470" y="270" width="140" height="60" rx="6" class="empty"/>
  <text x="540" y="306" text-anchor="middle" class="empty-t">—</text>
  <rect x="620" y="270" width="140" height="60" rx="6" class="low"/>
  <text x="690" y="306" text-anchor="middle" class="label filled">F-08</text>
</svg>
